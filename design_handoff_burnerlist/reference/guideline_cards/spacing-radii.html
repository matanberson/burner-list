<!-- reference copy: rendered guideline card -->
<html><head><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:16px;background:#fff;font-family:Inter,sans-serif"><div style="display:flex;gap:14px;align-items:center">
<div style="text-align:center"><div style="width:50px;height:50px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--paper)"></div><div style="font-size:10px;margin-top:4px;color:var(--text-mid)">xs 4px</div></div>
<div style="text-align:center"><div style="width:50px;height:50px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--paper)"></div><div style="font-size:10px;margin-top:4px;color:var(--text-mid)">sm 5px</div></div>
<div style="text-align:center"><div style="width:50px;height:50px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--paper)"></div><div style="font-size:10px;margin-top:4px;color:var(--text-mid)">md 6px</div></div>
<div style="text-align:center"><div style="width:50px;height:50px;border:1px solid var(--border-strong);border-radius:var(--radius-lg);background:var(--paper)"></div><div style="font-size:10px;margin-top:4px;color:var(--text-mid)">lg 8px</div></div>
<div style="text-align:center"><div style="width:50px;height:50px;border:1.5px solid var(--text-mid);border-radius:50%"></div><div style="font-size:10px;margin-top:4px;color:var(--text-mid)">round</div></div>
</div></body></html>
