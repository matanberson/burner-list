<!-- reference copy: rendered guideline card -->
<html><head><link rel="stylesheet" href="../styles.css"></head><script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<body style="margin:0;padding:16px;background:#fff;font-family:Inter,sans-serif">
<div style="display:flex;gap:18px;color:var(--text-faint)" id="row"></div>
<div style="font-size:11px;color:var(--text-soft);margin-top:10px">flame · pencil · trash-2 · grip-vertical · calendar-days · x · plus · list-checks · history · loader-circle · inbox · cloud-off · triangle-alert</div>
<script>['flame','pencil','trash-2','grip-vertical','calendar-days','x','plus','list-checks','history','loader-circle','inbox','cloud-off','triangle-alert'].forEach(n=>{const i=document.createElement('i');i.setAttribute('data-lucide',n);i.style.width='20px';i.style.height='20px';document.getElementById('row').appendChild(i)});lucide.createIcons();</script>
</body></html>
