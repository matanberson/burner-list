<!-- reference copy: rendered guideline card -->
<html><head><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;font-family:Inter,sans-serif;padding:16px;background:#fff"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">
<div><div style="height:56px;border-radius:6px;border:1px solid var(--border-strong);background:var(--paper)"></div><div style="font-size:11px;color:var(--text-mid);margin-top:4px">paper</div></div>
<div><div style="height:56px;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg)"></div><div style="font-size:11px;color:var(--text-mid);margin-top:4px">bg</div></div>
<div><div style="height:56px;border-radius:6px;background:var(--border)"></div><div style="font-size:11px;color:var(--text-mid);margin-top:4px">border</div></div>
<div><div style="height:56px;border-radius:6px;background:var(--text-faintest)"></div><div style="font-size:11px;color:var(--text-mid);margin-top:4px">text-faintest</div></div>
<div><div style="height:56px;border-radius:6px;background:var(--text-soft)"></div><div style="font-size:11px;color:var(--text-mid);margin-top:4px">text-soft</div></div>
<div><div style="height:56px;border-radius:6px;background:var(--text-mid)"></div><div style="font-size:11px;color:var(--text-mid);margin-top:4px">text-mid</div></div>
<div><div style="height:56px;border-radius:6px;background:var(--text-dark)"></div><div style="font-size:11px;color:var(--text-mid);margin-top:4px">text-dark</div></div>
</div></body></html>
